version: '3.8'

services:
  air-alert-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: air-alert-hub-rs:latest
    container_name: air-alert-hub-rs
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-admin_super_secret_master_key_123}
      - DATA_DIR=/app/data
      - DATA_DEFAULTS_DIR=/app/data_defaults
      - DANGER_RADIUS_KM=35.0
      - RUST_LOG=info
    volumes:
      - ./data:/app/data
