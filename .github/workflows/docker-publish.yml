name: Build and Push Multi-Arch Docker Image

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # Phase 1: Parallel multi-platform build across independent runners
  # =========================================================================
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            jobs: 2
          - arch: arm64
            platform: linux/arm64
            jobs: 2
          - arch: armv7
            platform: linux/arm/v7
            jobs: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM emulation)
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Architecture Image (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            CARGO_BUILD_JOBS=${{ matrix.jobs }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/air-alert-hub-rs:${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # =========================================================================
  # Phase 2: Merge single-architecture images into unified Multi-Arch Manifest
  # =========================================================================
  merge:
    name: Create & Push Multi-Arch Manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Multi-Arch Manifest List
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/air-alert-hub-rs"
          
          # Base latest multi-arch manifest
          TAGS="-t ${IMAGE}:latest"
          
          # If triggered by a Git tag (e.g. v1.0.0), also add version tag
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${TAGS} -t ${IMAGE}:${{ github.ref_name }}"
          fi

          echo "Creating multi-arch manifest with tags: ${TAGS}"
          docker buildx imagetools create ${TAGS} \
            ${IMAGE}:amd64 \
            ${IMAGE}:arm64 \
            ${IMAGE}:armv7

      - name: Verify Manifest
        run: |
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/air-alert-hub-rs:latest
